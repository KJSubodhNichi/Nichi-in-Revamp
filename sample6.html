<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Slideshow</title>
    <!-- jQuery for Slick Carousel -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- Slick Carousel CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>
    <style>
        /*
        Follow me on
        Dribbble: https://dribbble.com/supahfunk
        Twitter: https://twitter.com/supahfunk
        Codepen: https://codepen.io/supah/
        */
        body, html {
            height: 100%;
            background: #110101;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* Basic container for the slideshow to manage its position relative to the main body */
        .split-slideshow {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slideshow {
            position: absolute;
            z-index: 1;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .slideshow .slider {
            width: 100vw;
            height: 100vh; /* Changed from 100vw to 100vh for vertical slider items */
            z-index: 2;
        }

        .slideshow .slider * {
            outline: none;
        }

        .slideshow .slider .item {
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden;
            border: none;
        }

        .slideshow .slider .item .text {
            display: none;
        }

        .slideshow .slider .item img {
            min-width: 101%;
            min-height: 101%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover; /* Ensure images cover the area */
        }

        /* Slick Dots Styling */
        .slideshow .slick-dots {
            position: fixed;
            z-index: 100;
            width: 40px;
            height: auto;
            bottom: auto;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            left: auto;
            color: #fff;
            display: block;
            padding-right: 10px; /* Add some padding from the edge */
        }

        .slideshow .slick-dots li {
            display: block;
            width: 100%;
            height: auto;
            margin: 10px 0; /* Space between dots */
        }

        .slideshow .slick-dots li button {
            position: relative;
            width: 20px;
            height: 15px;
            text-align: center;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .slideshow .slick-dots li button:before {
            content: '';
            background: #fff;
            color: #fff;
            height: 2px;
            width: 20px;
            border-radius: 0;
            position: absolute;
            top: 50%;
            right: 0;
            left: auto;
            transform: translateY(-50%);
            transition: all .3s ease-in-out;
            opacity: 0.6;
        }

        .slideshow .slick-dots li.slick-active button:before {
            width: 40px;
            opacity: 1;
        }

        /* Right Slideshow for Split Effect */
        .slideshow.slideshow-right {
            left: 0;
            z-index: 1;
            width: 50vw;
            pointer-events: none; /* Allow interaction with elements behind it */
        }

        .slideshow.slideshow-right .slider {
            left: 0;
            position: absolute;
        }

        /* Slideshow Text Overlay */
        .slideshow-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            font-size: 80px;
            width: 100vw;
            text-align: center;
            color: #fff;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 100;
            pointer-events: none; /* Allow interaction with elements behind it */
            text-transform: uppercase;
            letter-spacing: 20px;
            line-height: 0.8;
        }

        @media (max-width: 767px) {
            .slideshow-text {
                font-size: 40px;
                letter-spacing: 10px;
            }
        }

        /* The Most Image (Bottom Left) */
        .the-most {
            position: fixed;
            z-index: 1;
            bottom: 0;
            left: 0;
            width: 50vw;
            max-width: 200px;
            padding: 10px;
        }

        .the-most img {
            max-width: 100%;
            height: auto; /* Maintain aspect ratio */
        }
    </style>
</head>
<body>
    <div class="split-slideshow">
        <div class="slideshow">
            <div class="slider">
                <div class="item">
                    <img src="https://raw.githubusercontent.com/supahfunk/supah-codepen/master/canyon-2.jpg" alt="Canyon 2" />
                </div>
                <div class="item">
                    <img src="https://raw.githubusercontent.com/supahfunk/supah-codepen/master/canyon-3.jpg" alt="Canyon 3" />
                </div>
                <div class="item">
                    <img src="https://raw.githubusercontent.com/supahfunk/supah-codepen/master/canyon-4.jpg" alt="Canyon 4" />
                </div>
                <div class="item">
                    <img src="https://raw.githubusercontent.com/supahfunk/supah-codepen/master/canyon-1.jpg" alt="Canyon 1" />
                </div>
                <!-- New Slides -->
                <div class="item">
                    <img src="https://placehold.co/1200x800/6F42C1/FFFFFF?text=Mountains" alt="Mountains" />
                </div>
                <div class="item">
                    <img src="https://placehold.co/1200x800/00C2B8/FFFFFF?text=Forest" alt="Forest" />
                </div>
            </div>
        </div>
        <div class="slideshow-text">
            <div class="item">Canyon</div>
            <div class="item">Desert</div>
            <div class="item">Erosion</div>
            <div class="item">Shape</div>
            <!-- New Text Items -->
            <div class="item">Mountains</div>
            <div class="item">Forest</div>
        </div>
    </div>

    <a class="the-most" target="_blank" href="https://codepen.io/2017/popular/pens/10/">
        <img src="https://raw.githubusercontent.com/supahfunk/supah-codepen/master/themost-2017.png" alt="The Most Popular Pens of 2017">
    </a>

    <!-- Slick Carousel JS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script>
        var $slider = $('.slideshow .slider'),
            maxItems = $('.item', $slider).length,
            dragging = false,
            tracking,
            rightTracking;

        // Clone the slideshow for the right split effect
        $sliderRight = $('.slideshow').clone().addClass('slideshow-right').appendTo($('.split-slideshow'));

        // Reverse the items for the right slider
        rightItems = $('.item', $sliderRight).toArray();
        reverseItems = rightItems.reverse();
        $('.slider', $sliderRight).html(''); // Clear existing items in the cloned slider
        for (i = 0; i < maxItems; i++) {
            $(reverseItems[i]).appendTo($('.slider', $sliderRight));
        }

        // Initialize the left slider (main slider)
        $slider.addClass('slideshow-left');
        $('.slideshow-left').slick({
            vertical: true,
            verticalSwiping: true,
            arrows: false,
            infinite: true,
            dots: true,
            speed: 1000,
            cssEase: 'cubic-bezier(0.7, 0, 0.3, 1)' // Custom easing for smooth animation
        }).on('beforeChange', function(event, slick, currentSlide, nextSlide) {
            // Logic to synchronize the right slider and text overlay based on the left slider's change
            if (currentSlide > nextSlide && nextSlide == 0 && currentSlide == maxItems - 1) {
                // If looping from last slide to first slide (going backward)
                $('.slideshow-right .slider').slick('slickGoTo', -1);
                $('.slideshow-text').slick('slickGoTo', maxItems);
            } else if (currentSlide < nextSlide && currentSlide == 0 && nextSlide == maxItems - 1) {
                // If looping from first slide to last slide (going forward)
                $('.slideshow-right .slider').slick('slickGoTo', maxItems);
                $('.slideshow-text').slick('slickGoTo', -1);
            } else {
                // Normal slide change
                $('.slideshow-right .slider').slick('slickGoTo', maxItems - 1 - nextSlide);
                $('.slideshow-text').slick('slickGoTo', nextSlide);
            }
        }).on("mousewheel", function(event) {
            // Handle mouse wheel scrolling for slide navigation
            event.preventDefault(); // Prevent default page scroll
            if (event.originalEvent.deltaX > 0 || event.originalEvent.deltaY < 0) {
                // Scroll right or scroll up -> next slide
                $(this).slick('slickNext');
            } else if (event.originalEvent.deltaX < 0 || event.originalEvent.deltaY > 0) {
                // Scroll left or scroll down -> previous slide
                $(this).slick('slickPrev');
            }
        }).on('mousedown touchstart', function(){
            // Start dragging: record initial transform values
            dragging = true;
            tracking = $('.slick-track', $slider).css('transform');
            tracking = parseInt(tracking.split(',')[5]); // Get Y-translation from matrix
            rightTracking = $('.slideshow-right .slick-track').css('transform');
            rightTracking = parseInt(rightTracking.split(',')[5]); // Get Y-translation for right slider
        }).on('mousemove touchmove', function(){
            // During dragging: synchronize right slider's movement based on left slider's movement
            if (dragging) {
                newTracking = $('.slideshow-left .slick-track').css('transform');
                newTracking = parseInt(newTracking.split(',')[5]);
                diffTracking = newTracking - tracking; // Calculate difference in Y-translation
                $('.slideshow-right .slick-track').css({'transform': 'matrix(1, 0, 0, 1, 0, ' + (rightTracking - diffTracking) + ')'});
            }
        }).on('mouseleave touchend mouseup', function(){
            // End dragging
            dragging = false;
        });

        // Initialize the right slider
        $('.slideshow-right .slider').slick({
            swipe: false, // Disable swipe for right slider as it's controlled by left
            vertical: true,
            arrows: false,
            infinite: true,
            speed: 950,
            cssEase: 'cubic-bezier(0.7, 0, 0.3, 1)',
            initialSlide: maxItems - 1 // Start at the last slide for reversed effect
        });

        // Initialize the text overlay slider
        $('.slideshow-text').slick({
            swipe: false, // Disable swipe for text slider as it's controlled by left
            vertical: true,
            arrows: false,
            infinite: true,
            speed: 900,
            cssEase: 'cubic-bezier(0.7, 0, 0.3, 1)'
        });
    </script>
</body>
</html>
